# ubuntu-hardener default configuration
#
# This file is sourced by ubuntu-hardener.sh as shell code. Keep values
# simple (KEY="value"), do not put commands here. Override with a copy and
# `--config /path/to/your.conf`.

# --- Paths -----------------------------------------------------------------
# Root directory for timestamped backups created before any change.
UH_BACKUP_ROOT="/var/backups/ubuntu-hardener"
# Directory for run logs.
UH_LOG_DIR="/var/log/ubuntu-hardener"
# Default directory for generated reports (overridden by --report DIR).
UH_REPORT_ROOT="/var/log/ubuntu-hardener/reports"

# Files this tool owns. It never edits unrelated drop-ins.
UH_SSHD_DROPIN="/etc/ssh/sshd_config.d/00-ubuntu-hardener.conf"
UH_SYSCTL_FILE="/etc/sysctl.d/99-ubuntu-hardener.conf"
UH_JOURNALD_DROPIN="/etc/systemd/journald.conf.d/99-ubuntu-hardener.conf"
UH_F2B_JAIL_FILE="/etc/fail2ban/jail.d/ubuntu-hardener.local"
UH_APT_AUTO_FILE="/etc/apt/apt.conf.d/20auto-upgrades"

# --- Firewall --------------------------------------------------------------
# Extra TCP ports to offer as "allow" rules when enabling UFW, in addition to
# the detected SSH port (which is always offered). Space separated, e.g.
# "80 443". The interactive prompt lets you edit this list before enabling.
UH_ALLOWED_TCP_PORTS=""
UH_UFW_DEFAULT_INCOMING="deny"
UH_UFW_DEFAULT_OUTGOING="allow"

# --- SSH hardening values --------------------------------------------------
UH_SSH_CLIENT_ALIVE_INTERVAL=300
UH_SSH_CLIENT_ALIVE_COUNT_MAX=2
UH_SSH_MAX_AUTH_TRIES=4
UH_SSH_LOGIN_GRACE_TIME=60

# --- Password policy -------------------------------------------------------
UH_PASS_MAX_DAYS=365
UH_PASS_MIN_DAYS=1
UH_PASS_WARN_AGE=14
UH_PWQUALITY_MINLEN=12
# Days without login after which a human account is reported as inactive.
UH_INACTIVE_DAYS=90

# --- fail2ban --------------------------------------------------------------
UH_F2B_MAXRETRY=5
UH_F2B_FINDTIME="10m"
UH_F2B_BANTIME="1h"

# --- journald --------------------------------------------------------------
UH_JOURNAL_MAX_USE="1G"

# --- Filesystem scans ------------------------------------------------------
# Seconds allowed for the world-writable / SUID scans (uses timeout(1)).
UH_FS_SCAN_TIMEOUT=60
# Maximum number of paths listed as evidence per finding.
UH_FS_SCAN_LIMIT=25
